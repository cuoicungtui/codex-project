[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-runtime"
version = "0.1.0"
description = "Workspace-first skill runtime harness"
requires-python = ">=3.12"
dependencies = [
  "agentskills-core==0.2.3",
  "agentskills-fs==0.2.3",
  "openai==1.97.1",
  "python-dotenv==1.1.1",
]

[project.scripts]
skill-runtime = "skill_runtime.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
